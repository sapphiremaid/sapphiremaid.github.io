<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07101a">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <title>sapphiremaid</title>
  <style>
    :root{--ink:#edf4ff;--muted:#8ba0b8;--line:rgba(184,211,242,.16);--blue:#91bfe8}
    *{box-sizing:border-box}
    html{min-width:320px;background:#050912;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;margin:0;display:grid;place-items:center;overflow-x:hidden;background:radial-gradient(circle at 20% 18%,rgba(53,102,166,.16),transparent 34rem),radial-gradient(circle at 82% 82%,rgba(70,125,176,.1),transparent 38rem),linear-gradient(160deg,#050912 0%,#07101a 56%,#07131d 100%)}
    body:before{position:fixed;inset:0;pointer-events:none;content:"";opacity:.2;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.55),transparent 80%)}
    main{position:relative;width:min(920px,calc(100% - 32px));padding:clamp(42px,7vw,82px) 0}
    .sigil{display:grid;width:42px;height:42px;place-items:center;margin-bottom:30px;border:1px solid rgba(184,211,242,.28);transform:rotate(45deg);box-shadow:0 0 28px rgba(76,137,202,.09),inset 0 0 18px rgba(120,170,220,.05)}
    .sigil:before{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 18px rgba(145,191,232,.42);content:""}
    h1{margin:0;font:500 clamp(48px,9vw,104px)/.86 Georgia,"Times New Roman",serif;letter-spacing:-.055em}
    .rule{width:min(520px,72vw);height:1px;margin-top:34px;background:linear-gradient(90deg,var(--line),transparent)}
    @media(max-width:640px){main{width:min(100% - 22px,520px);padding:30px 0 34px}.sigil{width:34px;height:34px;margin-bottom:24px}}
  </style>
</head>
<body>
  <main>
    <div class="sigil" aria-hidden="true"></div>
    <h1>sapphiremaid</h1>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
