name: Build Greyblue private bundle

on:
  pull_request:
    paths:
      - '.github/workflows/greyblue-personal-bundle.yml'
      - 'greyblue-personal/**'
      - 'greyblue-archipelago/**'
      - 'greyblue-dragon-flight-m1/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: greyblue-private-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout stabilized Greyblue
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run accepted Greyblue regression gate
        run: >-
          node --test
          greyblue-archipelago/tests/flight-controller.test.mjs
          greyblue-archipelago/tests/chase-camera.test.mjs
          greyblue-archipelago/tests/recovery.test.mjs
          greyblue-archipelago/tests/terrain-height.test.mjs
          greyblue-archipelago/tests/checkpoint-tracker.test.mjs

      - name: Vendor Three.js 0.180.0
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .bundle-deps -Force | Out-Null
          npm install --prefix .bundle-deps --no-save --ignore-scripts --package-lock=false three@0.180.0
          $installed = node -p "require('./.bundle-deps/node_modules/three/package.json').version"
          if ($installed -ne '0.180.0') { throw "Unexpected Three.js version: $installed" }

      - name: Assemble private bundle
        shell: pwsh
        run: |
          $out = 'dist/Greyblue'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item greyblue-archipelago "$out/greyblue-archipelago" -Recurse
          Copy-Item greyblue-dragon-flight-m1 "$out/greyblue-dragon-flight-m1" -Recurse
          Copy-Item greyblue-personal/* $out -Recurse

          New-Item -ItemType Directory -Path "$out/vendor/three/build" -Force | Out-Null
          New-Item -ItemType Directory -Path "$out/vendor/three/examples" -Force | Out-Null
          Copy-Item .bundle-deps/node_modules/three/build/three.module.js "$out/vendor/three/build/three.module.js"
          Copy-Item .bundle-deps/node_modules/three/examples/jsm "$out/vendor/three/examples/jsm" -Recurse

          $indexPath = "$out/greyblue-archipelago/index.html"
          $index = Get-Content $indexPath -Raw
          $index = $index.Replace('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js', '../vendor/three/build/three.module.js')
          $index = $index.Replace('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/', '../vendor/three/examples/jsm/')
          Set-Content $indexPath $index -Encoding utf8

          if (Select-String -Path $indexPath -Pattern 'cdn.jsdelivr.net/npm/three@0.180.0' -Quiet) {
            throw 'Bundled Greyblue still references the Three.js CDN'
          }
          if (-not (Test-Path "$out/greyblue-dragon-flight-m1/assets")) {
            throw 'Dragon asset directory is missing from private bundle'
          }
          $models = @(Get-ChildItem "$out/greyblue-dragon-flight-m1/assets" -Filter *.glb -Recurse)
          if ($models.Count -lt 1) { throw 'No dragon GLB models were bundled' }
          if (-not (Test-Path "$out/vendor/three/examples/jsm/loaders/GLTFLoader.js")) {
            throw 'Vendored Three.js GLTFLoader is missing'
          }

          $manifest = [ordered]@{
            schemaVersion = 1
            product = 'Greyblue private personal build'
            sourceCommit = '${{ github.event.pull_request.head.sha || github.sha }}'
            stabilizedBase = '540fbcd31003faf5d215d8a65c3821519a625121'
            threeVersion = '0.180.0'
            dragonModelCount = $models.Count
            networkBinding = '127.0.0.1'
            publicDeployment = $false
            builtAt = (Get-Date).ToUniversalTime().ToString('o')
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content "$out/greyblue-build-manifest.json" -Encoding utf8

      - name: Smoke-test local bundle server
        shell: pwsh
        run: |
          $env:GREYBLUE_NO_OPEN = '1'
          $stdout = Join-Path $env:RUNNER_TEMP 'greyblue-server.out'
          $stderr = Join-Path $env:RUNNER_TEMP 'greyblue-server.err'
          $process = Start-Process node -ArgumentList 'serve-greyblue.mjs' -WorkingDirectory 'dist/Greyblue' -WindowStyle Hidden -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $url = $null
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              if (Test-Path $stdout) {
                $url = (Get-Content $stdout | Select-Object -First 1)
                if ($url -match '^http://127\.0\.0\.1:\d+/greyblue-archipelago/$') { break }
              }
            }
            if (-not $url) { throw "Greyblue server did not report a URL. stderr: $(Get-Content $stderr -Raw -ErrorAction SilentlyContinue)" }
            $page = Invoke-WebRequest -UseBasicParsing -Uri $url
            if ($page.StatusCode -ne 200) { throw "Greyblue entry returned HTTP $($page.StatusCode)" }
            $vendor = Invoke-WebRequest -UseBasicParsing -Uri ($url.Replace('/greyblue-archipelago/', '/vendor/three/build/three.module.js'))
            if ($vendor.StatusCode -ne 200) { throw 'Vendored Three.js was not served successfully' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Package artifact
        shell: pwsh
        run: Compress-Archive -Path dist/Greyblue/* -DestinationPath dist/Greyblue-private.zip -CompressionLevel Optimal

      - name: Upload private Greyblue bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: greyblue-private-${{ github.sha }}
          path: dist/Greyblue-private.zip
          retention-days: 14
          if-no-files-found: error
